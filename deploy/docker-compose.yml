# Actual sync server on the personal VPS, deployed by .github/workflows/deploy.yml.
#
# The deploy script copies this file (and Caddyfile) to the VPS and runs
# `docker compose up -d` there, so the running config always matches master.
#
# 5006 stays bound to loopback: only Caddy publishes ports, and it proxies to
# actual_server over the compose network.
#
# The `environment:` tag is intentionally absent. Compose v5.5.1 rejects the
# upstream compose file's empty `environment:` key, and nothing here needs an
# ACTUAL_* variable: the server's trustedProxies default already covers the
# Docker network, so X-Forwarded-For from Caddy is honoured.
services:
  actual_server:
    # ACTUAL_IMAGE is set by deploy.sh (a sha tag, for an exact rollback target);
    # the default keeps a hand-run `docker compose up -d` on the rolling tag.
    image: ${ACTUAL_IMAGE:-ghcr.io/dragonl57/actual-server:master}
    ports:
      - '127.0.0.1:5006:5006'
    volumes:
      - ./actual-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  actual_ai:
    image: docker.io/sakowicz/actual-ai:latest
    # Secrets (Ollama key, server password, budget sync id) stay out of git; this
    # file exists only on the VPS, mode 600.
    env_file:
      - ./actual-ai.env
    environment:
      ACTUAL_SERVER_URL: http://actual_server:5006
      # Ollama Cloud serves an OpenAI-compatible API at /v1, and the openai
      # provider is the only actual-ai provider that sends an Authorization
      # header (the ollama provider takes no key, so it cannot reach the cloud).
      LLM_PROVIDER: openai
      OPENAI_BASE_URL: https://ollama.com/v1
      OPENAI_MODEL: gemma4:31b
      CLASSIFICATION_SCHEDULE_CRON: '0 */6 * * *'
      # classifyOnStartup classifies right after a deploy. dryRun keeps runs
      # read-only and has to be listed explicitly: the code reads the `enabled`
      # flag, which is false when FEATURES omits it, whatever the README says.
      FEATURES: '["dryRun", "syncAccountsBeforeClassify", "classifyOnStartup"]'
    depends_on:
      actual_server:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - actual_server
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
