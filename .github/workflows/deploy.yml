name: Deploy Actual

# master is production: every push to it builds the sync server image and
# deploys it to the personal VPS. Run it by hand from the Actions tab to
# redeploy the current master.
#
# Repo secret required: SSH_VPS_KEY, a private key whose public half is in
# thelong@103.245.236.208:~/.ssh/authorized_keys. The GHCR package is public,
# so the VPS needs no registry credentials.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dragonl57/actual-server
  DOMAIN: finance.thelong.online
  VPS_HOST: 103.245.236.208
  VPS_USER: thelong
  VPS_DIR: /home/thelong/actual

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The upstream Dockerfile builds the web client and the sync server from
      # the same tree, so the deployed app always matches this commit.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sync-server.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Two pushes must not deploy at once: they race on the same VM and the same
    # snapshot directory. Pending runs queue, nothing in flight is canceled.
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_VPS_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose files to the VPS
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            deploy/docker-compose.yml deploy/Caddyfile \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DIR }}/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
             DOMAIN=${{ env.DOMAIN }} \
             COMPOSE_DIR=${{ env.VPS_DIR }} \
             SKIP_BACKUP=${{ contains(github.event.head_commit.message, '[skip-backup]') && '1' || '0' }} \
             bash -s" \
            < deploy/deploy.sh
